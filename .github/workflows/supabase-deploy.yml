name: Deploy Supabase

on:
  push:
    branches:
      - main
    paths:
      - supabase/**
      - scripts/validate-supabase-migrations.mjs
      - .github/workflows/supabase-deploy.yml
  workflow_dispatch:

concurrency:
  group: supabase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Apply migrations and deploy Edge Functions
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate migration filenames and timestamps
        run: node scripts/validate-supabase-migrations.mjs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview pending migrations
        run: supabase db push --dry-run --linked

      - name: Apply migrations
        run: supabase db push --linked

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
