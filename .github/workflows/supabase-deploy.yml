name: Deploy Supabase

on:
  push:
    branches:
      - main
    paths:
      - supabase/**
      - scripts/validate-supabase-migrations.mjs
      - .github/workflows/supabase-deploy.yml
  workflow_dispatch:

concurrency:
  group: supabase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Validate function deployment secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN não está configurado."; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "::error::SUPABASE_PROJECT_REF não está configurado."; exit 1; }

      - name: Deploy Edge Functions
        shell: bash
        run: |
          for function_name in admin-reset-user-password admin-create-user public-create-support-ticket; do
            supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_REF" --use-api
          done

  deploy-database:
    name: Apply migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate migration filenames and timestamps
        run: node scripts/validate-supabase-migrations.mjs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Validate database deployment secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN não está configurado."; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "::error::SUPABASE_PROJECT_REF não está configurado."; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::SUPABASE_DB_PASSWORD não está configurado."; exit 1; }

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Show migration status
        run: supabase migration list --linked

      - name: Preview pending migrations
        run: supabase db push --dry-run --linked --include-all

      - name: Apply migrations
        shell: bash
        run: |
          set +e
          log_file="$(mktemp)"
          supabase db push --linked --include-all 2>&1 | tee "$log_file"
          exit_code=${PIPESTATUS[0]}

          if [ "$exit_code" -ne 0 ]; then
            {
              echo "## Falha ao aplicar migrations"
              echo
              echo '```text'
              grep -E 'Applying migration|ERROR:|SQLSTATE|At statement:|Error:' "$log_file" | tail -n 40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            error_line="$(grep -E '^ERROR:|^Error:' "$log_file" | tail -n 1)"
            if [ -n "$error_line" ]; then
              echo "::error title=Apply migrations::$error_line"
            fi
          fi

          rm -f "$log_file"
          exit "$exit_code"
