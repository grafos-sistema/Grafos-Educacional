name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migration-contract:
    name: Validate Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate migration filenames and timestamps
        run: node scripts/validate-supabase-migrations.mjs

      - name: Audit RLS coverage
        run: node scripts/audit-supabase-rls.mjs

  api:
    name: Build API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Lint
        run: npm run lint:check

      - name: Unit tests
        run: npm run test:ci

      - name: HTTP smoke tests
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build

  frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3333
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      NEXT_PUBLIC_DEPLOYMENT_TYPE: MAIN
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Lint
        run: npm run lint:check

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build

  landing:
    name: Build landing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: landing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --omit=optional --audit-level=high

      - name: Lint
        run: npm run lint:check

      - name: Build
        run: npm run build

  security:
    name: Security and container scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan repository for secrets and misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Build API image
        run: docker build --tag grafos-api:security-scan ./api

      - name: Smoke test production image against Supabase pooler
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"

          ENCODED_PASSWORD="$(node -e "process.stdout.write(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))")"
          DATABASE_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${ENCODED_PASSWORD}@aws-1-us-east-2.pooler.supabase.com:6543/postgres?pgbouncer=true&connection_limit=5&pool_timeout=10&connect_timeout=10"

          docker run --detach --name grafos-api-smoke --publish 3333:3333 \
            --env NODE_ENV=production \
            --env PORT=3333 \
            --env APP_NAME="Grafos API CI" \
            --env DATABASE_URL="$DATABASE_URL" \
            --env JWT_SECRET="ci-runtime-smoke-jwt-secret" \
            --env JWT_REFRESH_SECRET="ci-runtime-smoke-refresh-secret" \
            grafos-api:security-scan npm start

          trap 'docker logs grafos-api-smoke; docker rm --force grafos-api-smoke' EXIT

          test "$(docker exec grafos-api-smoke id -u)" != "0"
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3333/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          exit 1

      - name: Scan API image dependencies and operating system
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: grafos-api:security-scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
